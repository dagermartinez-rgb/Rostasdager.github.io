<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Rotas de Transporte com Maps</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #eef3f7;
    }

    header {
      background: #1565C0;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .container {
      width: 95%;
      max-width: 1200px;
      margin: auto;
      margin-top: 20px;
      margin-bottom: 30px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0px 2px 10px rgba(0, 0, 0, 0.2);
      margin-bottom: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
    }

    label {
      font-weight: bold;
      display: block;
      margin-top: 10px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      margin-top: 5px;
    }

    button {
      padding: 10px 14px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
    }

    .salvar {
      background: #2E7D32;
      color: white;
      margin-top: 15px;
      padding: 12px 20px;
    }

    .editar {
      background: #FB8C00;
      color: white;
    }

    .excluir {
      background: #C62828;
      color: white;
    }

    .maps-btn {
      background: #1565C0;
      color: white;
    }

    table {
      width: 100%;
      margin-top: 20px;
      border-collapse: collapse;
    }

    th {
      background: #1565C0;
      color: white;
      padding: 10px;
      text-align: left;
    }

    td {
      padding: 10px;
      border-bottom: 1px solid #ddd;
      vertical-align: top;
    }

    tr:hover {
      background: #f5f5f5;
    }

    #pesquisa {
      margin-bottom: 20px;
    }

    /* Estilos das Paradas e Status de Chegada */
    .parada-item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .parada-item span.confirmada {
      text-decoration: line-through;
      color: #2E7D32;
      font-weight: bold;
    }

    .tempo-estimado {
      background: #e3f2fd;
      color: #0d47a1;
      padding: 6px 10px;
      border-radius: 5px;
      font-weight: bold;
      display: inline-block;
      margin-top: 5px;
    }

    #map {
      height: 350px;
      width: 100%;
      border-radius: 8px;
      margin-top: 10px;
    }

    .modal-maps {
      display: none;
    }

    .modal-maps.ativo {
      display: block;
    }
  </style>
</head>
<body>
  <header>
    <h1>Sistema de Rotas de Transporte</h1>
  </header>

  <div class="container">
    <div class="card">
      <h2>Cadastrar / Editar Rota</h2>
      <div class="grid">
        <div>
          <label>Rota</label>
          <input id="rota" placeholder="Ex: Rota Centro-Norte">
        </div>
        <div>
          <label>Motorista</label>
          <input id="motorista" placeholder="Nome do motorista">
        </div>
        <div>
          <label>Veículo</label>
          <input id="veiculo" placeholder="Placa / Modelo">
        </div>
        <div>
          <label>Saída (Horário)</label>
          <input type="time" id="hora">
        </div>
        <div>
          <label>Origem (Início)</label>
          <input id="origem" placeholder="Cidade / Endereço de saída">
        </div>
        <div>
          <label>Parada 1</label>
          <input id="p1" placeholder="Endereço Parada 1">
        </div>
        <div>
          <label>Parada 2</label>
          <input id="p2" placeholder="Endereço Parada 2">
        </div>
        <div>
          <label>Parada 3</label>
          <input id="p3" placeholder="Endereço Parada 3">
        </div>
        <div>
          <label>Destino Final</label>
          <input id="destino" placeholder="Cidade / Endereço de chegada">
        </div>
        <div>
          <label>Tempo Estimado Total (minutos)</label>
          <input type="number" id="tempo" placeholder="Ex: 45">
        </div>
      </div>
      <button class="salvar" onclick="salvar()">Salvar Rota</button>
    </div>

    <div class="card">
      <input id="pesquisa" placeholder="Pesquisar por rota, motorista ou destino..." onkeyup="listar()">
      <table>
        <thead>
          <tr>
            <th>Rota</th>
            <th>Motorista / Veículo</th>
            <th>Horário & Tempo</th>
            <th>Confirmação de Paradas</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="tabela">
        </tbody>
      </table>
    </div>

    <div class="card modal-maps" id="cardMapa">
      <h3>Visualização no Mapa: <span id="tituloMapa"></span></h3>
      <p id="linkGoogleMaps"></p>
      <div id="map"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    let rotas = JSON.parse(localStorage.getItem("rotas")) || [];
    let editarIndice = -1;
    let mapaLeaflet = null;

    function salvar() {
      let rota = document.getElementById("rota").value;
      let motorista = document.getElementById("motorista").value;
      let veiculo = document.getElementById("veiculo").value;
      let hora = document.getElementById("hora").value;
      let origem = document.getElementById("origem").value;
      let p1 = document.getElementById("p1").value;
      let p2 = document.getElementById("p2").value;
      let p3 = document.getElementById("p3").value;
      let destino = document.getElementById("destino").value;
      let tempo = document.getElementById("tempo").value;

      if (!rota || !origem || !destino) {
        alert("Preencha ao menos o Nome da Rota, Origem e Destino!");
        return;
      }

      // Estrutura com checagem de confirmação para cada parada
      let dados = {
        rota, 
        motorista, 
        veiculo, 
        hora, 
        origem,
        tempo,
        destino,
        paradas: [
          { nome: p1, confirmada: false },
          { nome: p2, confirmada: false },
          { nome: p3, confirmada: false }
        ]
      };

      if (editarIndice == -1) {
        rotas.push(dados);
      } else {
        // Preserva o status das paradas já confirmadas se o nome não mudou
        dados.paradas.forEach((p, idx) => {
          if (rotas[editarIndice].paradas[idx]) {
            p.confirmada = rotas[editarIndice].paradas[idx].confirmada;
          }
        });
        rotas[editarIndice] = dados;
        editarIndice = -1;
      }

      localStorage.setItem("rotas", JSON.stringify(rotas));
      limpar();
      listar();
    }

    function listar() {
      let texto = document.getElementById("pesquisa").value.toLowerCase();
      let tabela = document.getElementById("tabela");
      tabela.innerHTML = "";

      rotas.forEach((r, i) => {
        let busca = (r.rota + r.motorista + r.veiculo + r.destino + r.origem).toLowerCase();
        if (busca.includes(texto)) {

          // Monta a lista de confirmação das paradas
          let paradasHTML = `<div class="parada-item">📌 <b>Origem:</b> ${r.origem}</div>`;
          
          r.paradas.forEach((p, pIndex) => {
            if (p.nome && p.nome.trim() !== "") {
              let checado = p.confirmada ? "checked" : "";
              let classeConfirmada = p.confirmada ? "confirmada" : "";
              
              paradasHTML += `
                <div class="parada-item">
                  <input type="checkbox" ${checado} onchange="alternarConfirmacao(${i}, ${pIndex})">
                  <span class="${classeConfirmada}">Parada ${pIndex + 1}: ${p.nome}</span>
                </div>
              `;
            }
          });

          paradasHTML += `<div class="parada-item">🏁 <b>Destino:</b> ${r.destino}</div>`;

          tabela.innerHTML += `
            <tr>
              <td><b>${r.rota}</b></td>
              <td>${r.motorista}<br><small>(${r.veiculo})</small></td>
              <td>
                Saída: ${r.hora || "N/A"}<br>
                <div class="tempo-estimado">⏱ Tempo Total: ${r.tempo ? r.tempo + " min" : "Não inf."}</div>
              </td>
              <td>${paradasHTML}</td>
              <td>
                <button class="maps-btn" onclick="abrirMapa(${i})">🗺 Mapa</button>
                <button class="editar" onclick="editar(${i})">Editar</button>
                <button class="excluir" onclick="excluir(${i})">Excluir</button>
              </td>
            </tr>
          `;
        }
      });
    }

    // Alterna a confirmação de chegada na parada
    function alternarConfirmacao(rotaIdx, paradaIdx) {
      rotas[rotaIdx].paradas[paradaIdx].confirmada = !rotas[rotaIdx].paradas[paradaIdx].confirmada;
      localStorage.setItem("rotas", JSON.stringify(rotas));
      listar();
    }

    // Abre o link do Google Maps + Visualização do Mapa
    function abrirMapa(i) {
      let r = rotas[i];
      let pontos = [r.origem];
      
      r.paradas.forEach(p => {
        if (p.nome && p.nome.trim() !== "") pontos.push(p.nome);
      });
      pontos.push(r.destino);

      // Gera URL para o Google Maps com os waypoints
      let urlGoogle = `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(r.origem)}&destination=${encodeURIComponent(r.destino)}`;
      
      let waypoints = r.paradas
        .filter(p => p.nome && p.nome.trim() !== "")
        .map(p => encodeURIComponent(p.nome))
        .join('|');

      if (waypoints) {
        urlGoogle += `&waypoints=${waypoints}`;
      }

      let cardMapa = document.getElementById("cardMapa");
      cardMapa.classList.add("ativo");

      document.getElementById("tituloMapa").innerText = r.rota;
      document.getElementById("linkGoogleMaps").innerHTML = `
        <a href="${urlGoogle}" target="_blank" style="color: #1565C0; font-weight: bold;">
             Abrir Rota Completa no Google Maps ↗
        </a>
      `;

      // Inicializa o mapa com Leaflet (visão geral)
      if (mapaLeaflet) {
        mapaLeaflet.remove();
      }
      mapaLeaflet = L.map('map').setView([-25.4284, -49.2733], 11); // Coordenadas padrão
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
      }).addTo(mapaLeaflet);
    }

    function editar(i) {
      let r = rotas[i];
      document.getElementById("rota").value = r.rota;
      document.getElementById("motorista").value = r.motorista;
      document.getElementById("veiculo").value = r.veiculo;
      document.getElementById("hora").value = r.hora;
      document.getElementById("origem").value = r.origem || "";
      document.getElementById("p1").value = r.paradas[0] ? r.paradas[0].nome : "";
      document.getElementById("p2").value = r.paradas[1] ? r.paradas[1].nome : "";
      document.getElementById("p3").value = r.paradas[2] ? r.paradas[2].nome : "";
      document.getElementById("destino").value = r.destino;
      document.getElementById("tempo").value = r.tempo || "";
      editarIndice = i;
    }

    function excluir(i) {
      if (confirm("Excluir rota?")) {
        rotas.splice(i, 1);
        localStorage.setItem("rotas", JSON.stringify(rotas));
        listar();
      }
    }

    function limpar() {
      document.querySelectorAll("input").forEach(c => {
        if (c.id !== "pesquisa") {
          c.value = "";
        }
      });
    }

    listar();
  </script>
</body>
</html>
